name: Product defect
description: Report one reproducible defect or documentation error in the published product
title: "[Defect] "
body:
  - type: markdown
    attributes:
      value: |
        This repository is owner-maintained and is not a community development project. Use this form only for a reproducible product defect or documentation error.
  - type: checkboxes
    id: public-report-safety
    attributes:
      label: Public-report safety
      options:
        - label: I removed credentials, tokens, private URLs, personal details, local absolute paths, conversations, and unsanitized logs.
          required: true
        - label: I am reporting one problem in an available MO release or its user documentation.
          required: true
        - label: This is not a suspected security vulnerability; I will follow SECURITY.md and keep sensitive reports private.
          required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - MO Terminal
        - MO Desktop
        - MO Everywhere / Hub
        - Android app
        - Connected Tab
        - Headless service / container
        - Documentation
        - Other public product surface
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest safe sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and observed result
      description: State what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Product version
      description: The version displayed by MO (and build identifier if available), or the Android Store version. A source checkout is not required.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Optional minimal traceback or diagnostic excerpt. Do not attach state homes, config files, credential files, memory databases, conversations, or raw diagnostic archives.
    validations:
      required: false
